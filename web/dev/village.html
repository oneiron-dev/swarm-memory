<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Village plate study</title>
  <!-- the book's tokens: --serif and its Source Serif 4 faces, so the board letters in the book's own font (?georgia for the fallback) -->
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <style>
    :root { color-scheme: light; font-family: "Avenir Next", Avenir, sans-serif; color: #1f1d1a; background: #f3eee4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 32px 40px; }
    h1 { margin: 0 0 4px; font: 500 24px Georgia, serif; }
    p.lede { margin: 0 0 18px; font-size: 13px; color: #78715f; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin: 0 0 18px; font-size: 13px; }
    .controls label { display: flex; align-items: center; gap: 10px; }
    input[type=range] { width: 280px; accent-color: #78715f; }
    button { font: inherit; padding: 4px 12px; border: 1px solid #b9ae98; background: #f8f3e9; color: #1f1d1a; border-radius: 4px; cursor: pointer; min-width: 72px; }
    output, .time { font: 12px ui-monospace, "SFMono-Regular", monospace; font-variant-numeric: tabular-nums; color: #3a362f; }
    .row { display: flex; flex-wrap: wrap; gap: 20px; margin: 0 0 22px; }
    figure { margin: 0; }
    .plate { position: relative; background: #efe8da url("/plates/wash/neutral.webp") center 45% / cover no-repeat; overflow: hidden; }
    .plate::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(248, 244, 236, 0.5) 0%, rgba(248, 244, 236, 0.2) 40%, rgba(248, 244, 236, 0) 70%); pointer-events: none; }
    .plate canvas { position: relative; z-index: 1; display: block; }
    figcaption { margin-top: 6px; font-size: 12px; color: #78715f; display: flex; justify-content: space-between; gap: 12px; }
  </style>
</head>
<body>
  <h1>Village plate</h1>
  <p class="lede">Five sample days drawn by drawVillage at 440 x 280 and 360 x 200 CSS pixels, at 2x. The scene is the day; the clock is the life. ?words=1 adds the year's real goals on the board at four plate sizes.</p>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <label for="clock">Clock <input id="clock" type="range" min="0" max="16" step="0.05" value="0" /> <output id="clock-out">0.00 s</output></label>
    <span class="time" id="frame"></span>
    <span class="time" id="face"></span>
  </div>
  <div class="controls">
    <label for="t">Day progress, no clock <input id="t" type="range" min="0" max="1" step="0.01" value="0.4" /> <output id="t-out">0.40</output></label>
    <label><input id="own" type="checkbox" checked /> each scene keeps its own moment</label>
    <label><input id="noclock" type="checkbox" /> draw without a clock</label>
    <span class="time" id="summary"></span>
  </div>
  <div class="row" id="big"></div>
  <div class="row" id="small"></div>
  <div class="row" id="life"></div>
  <div class="controls"><span class="time" id="frame-stage"></span></div>
  <div class="row" id="props"></div>
  <div class="row" id="stage"></div>
  <div class="row" id="fixes"></div>
  <div class="row" id="nobody"></div>
  <script type="module" src="./village.ts"></script>
</body>
</html>
